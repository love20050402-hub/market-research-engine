name: Daily Opportunity Radar

on:
  schedule:
    - cron: '17 23 * * *' # 07:17 Asia/Taipei, next calendar day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-radar.yml'
      - 'run_daily_radar.py'
      - 'radar/**'
      - 'scripts/run_tests.py'
      - 'tests/**'

permissions:
  contents: write
  issues: read

concurrency:
  group: opportunity-radar-production
  cancel-in-progress: false

jobs:
  daily:
    # Standard public runner is free; never switch a private repo to billable execution.
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.11'
      - name: Run daily radar
        id: radar
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RADAR_REPOSITORY: ${{ github.repository }}
        run: python run_daily_radar.py --state-file data/github_history.jsonl --github-issues "$RADAR_REPOSITORY"
      - name: Test without touching production history
        run: python scripts/run_tests.py
      - name: Save report in mobile-readable job summary
        if: always()
        run: |
          if test -f output/daily_report.md; then
            cat output/daily_report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f logs/radar.log; then
            tail -n 30 logs/radar.log
          fi
      - name: Commit report and persistent state if changed
        env:
          RADAR_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/github_history.jsonl output/daily_report.md output/uk_leads.csv output/uk_leads_top.md output/money_radar.csv output/money_radar_top5.md output/pain_radar.csv output/pain_radar_top5.md output/ledgerdrop_validation.csv output/pending_intake.csv
          git add -- output/preview/daily_report.md
          git add -- output/action_queue.md output/pain_clusters.md output/filter_summary.md output/opportunities.csv
          git add -- output/near_misses.md
          git add -- output/market_top10.md output/market_top10.csv
          if git diff --cached --quiet; then
            echo 'No report/state changes.'
            exit 0
          fi
          git commit -m "radar: daily update $(date -u +%F)"
          git pull --rebase origin "$RADAR_BRANCH"
          git push origin "HEAD:$RADAR_BRANCH"
      - name: Publish core failure status without history changes
        if: failure() && steps.radar.outcome == 'failure'
        env:
          RADAR_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          printf '# Opportunity Radar\n\n**FAILED**\n\nUTC: %s\n\nCore run failed. See GitHub Actions logs; recommendations unavailable.\n' "$(date -u +%FT%TZ)" > output/daily_report.md
          printf "# Today's Action Queue\n\nFAILED — recommendations unavailable.\n" > output/action_queue.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- output/daily_report.md output/action_queue.md
          git diff --cached --quiet && exit 0
          git commit -m "radar: failure status $(date -u +%F)"
          git push origin "HEAD:$RADAR_BRANCH"
